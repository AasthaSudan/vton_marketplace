name: Clothsy CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed apps packages

      - name: Static code analysis
        run: flutter analyze --fatal-infos --fatal-warnings apps packages

      - name: Test shared core
        working-directory: packages/clothsy_core
        run: flutter test --coverage

      - name: Test customer app
        working-directory: apps/customer
        run: flutter test --coverage

      - name: Test seller panel
        working-directory: apps/seller_web
        run: flutter test

      - name: Test admin panel
        working-directory: apps/admin_web
        run: flutter test

  build:
    name: Build apps
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build customer APK (debug, mock flavor)
        working-directory: apps/customer
        run: flutter build apk --debug -t lib/main_mock.dart

      - name: Build seller panel (web)
        working-directory: apps/seller_web
        run: flutter build web --release

      - name: Build admin panel (web)
        working-directory: apps/admin_web
        run: flutter build web --release
