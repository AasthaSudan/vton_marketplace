# Local API gateway: the same paths a hosted Supabase project serves, so the
# app only changes its base URL. CORS is handled here (and stripped from the
# services) so Flutter web on another localhost port can call every service.
worker_processes 1;
events { worker_connections 512; }

http {
  client_max_body_size 12m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_read_timeout 160s;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  proxy_hide_header Access-Control-Expose-Headers;

  map $http_access_control_request_headers $cors_request_headers {
    ""      "authorization, apikey, content-type, x-client-info, x-upsert, prefer, range, accept-profile, content-profile, x-supabase-api-version";
    default $http_access_control_request_headers;
  }

  server {
    listen 8000;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers $cors_request_headers always;
    add_header Access-Control-Expose-Headers "content-range, range, sb-error-code, x-supabase-api-version, x-total-count" always;
    add_header Access-Control-Max-Age 600 always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = /health {
      return 200 "ok";
    }

    location /auth/v1/ {
      proxy_pass http://auth:9999/;
    }

    location /rest/v1/ {
      proxy_pass http://rest:3000/;
    }

    location /storage/v1/ {
      proxy_set_header X-Forwarded-Prefix /storage/v1;
      proxy_pass http://storage:5000/;
    }

    location /functions/v1/ {
      proxy_pass http://functions:9000/;
    }
  }
}
